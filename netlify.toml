[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ejs"]
  included_files = ["views/**", "netlify/functions/views/**", "models/**", "routes/**", "public/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
